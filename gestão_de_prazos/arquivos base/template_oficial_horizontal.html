    <style>

        /* Centralizar dados a partir da coluna D (4ª coluna) */
        table.dataTable tbody td:nth-child(n+4){ text-align:center !important; }

/* Tooltip hover (datas) */

  padding: 8px 10px;

        <button class="btn-export btn-copy" onclick="copyFiltered()">📋 Copiar</button>

<div class="table-container">
    <table id="tabela-prazos" class="display">
        <thead>
            <tr>
                <th>CD</th><th>MODAL</th><th>GEOGRAFIA COM</th><th>LOCALIZAÇÃO COMERCIAL</th><th>LOCALIDADE</th><th>METODO CD</th><th>PRAZO CD</th><th>METODO TR</th><th>PRAZO TR</th><th>PRAZO CLIENTE</th><th>H. INICIAL</th><th>H. FINAL</th><th>Rota Fixa</th><th>Segunda</th><th>Terca</th><th>Quarta</th><th>Quinta</th><th>Sexta</th><th>Sabado</th><th>Domigo</th>
            </tr>
        </thead>
        <tbody>	
<!--DATA_ROWS_START-->
<!--DATA_ROWS_END-->
	</tbody>
    </table>
</div>

<script>
    $(document).ready(function() {
        var table = $('#tabela-prazos').DataTable({
            "fixedHeader": true,
            "paging": false, // Desativado para ver tudo rolando com o header fixo
            "scrollY": "70vh", // Altura da rolagem
            "scrollX": false,
            "scrollCollapse": true,
            "language": { "url": "//cdn.datatables.net/plug-ins/1.13.6/i18n/pt-BR.json" },
            "dom": 'ft', // Apenas filtro e tabela, remove o resto para ganhar espaço
            "order": [[ 3, "asc" ]]
        });
    });

    function getFilteredMatrix() {
        // Matriz (array de arrays) com header + linhas filtradas (respeita busca/ordenação)
        var dt = $('#tabela-prazos').DataTable();
        var headers = [];
        $('#tabela-prazos thead th').each(function(){ headers.push($(this).text().trim()); });

        var rows = [];
        dt.rows({ search: 'applied', order: 'applied' }).every(function(){
            var node = this.node();
            var row = [];
            $(node).find('td').each(function(){ row.push($(this).text().trim()); });
            rows.push(row);
        });

        return [headers].concat(rows);
    }

    function exportFilteredXlsx() {
        var matrix = getFilteredMatrix();
        if(matrix.length <= 1){ alert('Nada para exportar (sem linhas após o filtro).'); return; }
        var ws = XLSX.utils.aoa_to_sheet(matrix);
        var wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Prazo');
        XLSX.writeFile(wb, 'gestor_prazos_magalog.xlsx');
    }

    function exportFilteredCsv() {
        var matrix = getFilteredMatrix();
        if(matrix.length <= 1){ alert('Nada para exportar (sem linhas após o filtro).'); return; }
        // CSV com separador ; (mais amigável no Excel PT-BR)
        var csv = matrix.map(function(r){
            return r.map(function(v){
                var s = (v === null || v === undefined) ? '' : String(v);
                s = s.replace(/"/g, '""');
                return '"' + s + '"';
            }).join(';');
        }).join('\n');

        var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'gestor_prazos_magalog.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function copyFiltered() {
        var matrix = getFilteredMatrix();
        if(matrix.length <= 1){ alert('Nada para copiar (sem linhas após o filtro).'); return; }
        // TSV (TAB) para colar no Excel
        var tsv = matrix.map(function(r){ return r.join('\t'); }).join('\n');

        if(navigator.clipboard && navigator.clipboard.writeText){
            navigator.clipboard.writeText(tsv).then(function(){
                alert('Copiado! (apenas o que está filtrado)');
            }).catch(function(){ fallbackCopy(tsv); });
        }else{
            fallbackCopy(tsv);
        }
    }

    function fallbackCopy(text){
        var ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        alert('Copiado! (apenas o que está filtrado)');
    }
</script>


<style>

<div id="custom-modal"><div class="modal-content"><div class="modal-header">Detalhes do Prazo Dinâmico</div><div id="modal-text" class="modal-body"></div><p style="font-size:12px; color:green;">Copiado para a área de transferência!</p><button class="modal-btn" onclick="closeModal()">OK</button></div></div>

<script>
function showModal(text) {
    const cleanText = text.replace(/\\n/g, '\n');
    document.getElementById('modal-text').innerText = cleanText;
    navigator.clipboard.writeText(cleanText);
    document.getElementById('custom-modal').style.display = 'block';
}
function closeModal() { document.getElementById('custom-modal').style.display = 'none'; }

$(document).ready(function() {
    if ($.fn.DataTable.isDataTable('#tabela-prazos')) {
        $('#tabela-prazos').DataTable().destroy();
    }
    $('#tabela-prazos').DataTable({
        "fixedHeader": true, "paging": false, "scrollY": "70vh", "scrollCollapse": true, "dom": 'ft',
        "columnDefs": [
            { "searchable": true, "targets": [1, 2, 3, 4, 9] },
            { "searchable": false, "targets": "_all" }
        ],
        "language": { "url": "//cdn.datatables.net/plug-ins/1.13.6/i18n/pt-BR.json" }
    });
});

(function(){
  const tip = document.getElementById("hoverTip");

  const dayMap = {
    "SEGUNDA": 1, "SEGUNDA-FEIRA": 1,
    "TERCA": 2, "TERÇA": 2, "TERCA-FEIRA": 2, "TERÇA-FEIRA": 2,
    "QUARTA": 3, "QUARTA-FEIRA": 3,
    "QUINTA": 4, "QUINTA-FEIRA": 4,
    "SEXTA": 5, "SEXTA-FEIRA": 5,
    "SABADO": 6, "SÁBADO": 6,
    "DOMINGO": 0,
    // caso venha "DOMIGO" por algum legado/typo
    "DOMIGO": 0
  };

  function normalize(s){
    return (s || "")
      .toString()
      .trim()
      .toUpperCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "");
  }

  function fmtBR(d){
    const dd = String(d.getDate()).padStart(2,'0');
    const mm = String(d.getMonth()+1).padStart(2,'0');
    const yy = d.getFullYear();
    return `${dd}/${mm}/${yy}`;
  }

  function nextDowDate(dowIndex, fromDate){
    // fromDate: hoje
    const d = new Date(fromDate.getFullYear(), fromDate.getMonth(), fromDate.getDate());
    const cur = d.getDay(); // 0=Dom .. 6=Sab
    let add = (dowIndex - cur + 7) % 7;
    if(add === 0) add = 7; // "próxima" ocorrência (não hoje)
    d.setDate(d.getDate() + add);
    return d;
  }

  // Extrai o "Dia de Entrega Real" e "Dia do Prazo Ofertado" do card de 6 linhas
  // Linhas esperadas:
  // 1) Localização + Geografia + Modal
  // 2) Dia do Pedido + Janela
  // 3) Dia de Produção
  // 4) Dia de Entrega Real
  // 5) Dia do Prazo Ofertado
  // 6) CD | TR | CLIENTE
  function extractDowsFromOnClick(td){
    const oc = td.getAttribute("onclick") || "";
    // pega o conteúdo dentro de showModal('...')
    const m = oc.match(/showModal\('([\s\S]*)'\)/);
    if(!m) return null;

    // o script do template usa \\n dentro da string do onclick
    const txt = m[1].replace(/\\n/g, "\n");
    const lines = txt.split("\n").map(l => l.trim()).filter(Boolean);

    if(lines.length < 6) return null;

    const entregaRealLine = normalize(lines[3]);   // linha 4
    const ofertadoLine    = normalize(lines[4]);   // linha 5

    // A linha pode vir tipo "Dia de Entrega Real: SABADO" ou só "SABADO"
    const pickDow = (line) => {
      const parts = line.split(":");
      const candidate = normalize(parts.length > 1 ? parts[1] : line);
      return candidate;
    };

    return {
      entregaRealDow: pickDow(entregaRealLine),
      ofertadoDow: pickDow(ofertadoLine),
    };
  }

  function showTip(x, y, html){
    tip.innerHTML = html;
    tip.style.display = "block";
    // evitar sair da tela à direita/embaixo
    const pad = 12;
    const rect = tip.getBoundingClientRect();
    let left = x + 14;
    let top  = y + 14;
    if(left + rect.width > window.innerWidth - pad) left = x - rect.width - 14;
    if(top  + rect.height > window.innerHeight - pad) top  = y - rect.height - 14;
    tip.style.left = `${left}px`;
    tip.style.top  = `${top}px`;
  }

  function hideTip(){ tip.style.display = "none"; }

  function bindHover(){
    // aplica em todas as células OK (inclusive após filtro/ordenação)
    document.querySelectorAll("td.ok").forEach(td => {
      if(td.dataset.hoverBound === "1") return;
      td.dataset.hoverBound = "1";

      td.addEventListener("mousemove", (ev) => {
        const dows = extractDowsFromOnClick(td);
        if(!dows) return;

        const realIdx = dayMap[dows.entregaRealDow];
        const offIdx  = dayMap[dows.ofertadoDow];

        if(realIdx === undefined || offIdx === undefined) return;

        const today = new Date();
        const dtReal = nextDowDate(realIdx, today);
        const dtOff  = nextDowDate(offIdx, today);

        showTip(ev.clientX, ev.clientY,
          `<div><b>Entrega real:</b> ${fmtBR(dtReal)}</div>` +
          `<div><b>Entrega ofertada:</b> ${fmtBR(dtOff)}</div>` +
          `<div class="muted">Base: próxima ocorrência a partir de hoje</div>`
        );
      });

      td.addEventListener("mouseleave", hideTip);
    });
  }

  // 1ª amarração
  document.addEventListener("DOMContentLoaded", bindHover);
  // Reaplica após redraw do DataTables (filtro/ordenação/paginação)
  if(window.jQuery && jQuery.fn.dataTable){
    jQuery(function(){
      const dt = jQuery("#tabela-prazos").DataTable();
      dt.on("draw", bindHover);
    });
  }
})();
</script>

<div id="hoverTip"></div>
</body>
